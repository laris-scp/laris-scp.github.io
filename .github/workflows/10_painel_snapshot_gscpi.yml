name: 10 - Update painel_snapshot (GSCPI)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update 09_gscpi_fretes_series
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cafe-gscpi-snapshot
  cancel-in-progress: false

jobs:
  update-snapshot-gscpi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run snapshot updater (GSCPI)
        run: |
          python scripts/cafe/update_painel_snapshot_gscpi.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/painel_snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(cafe): update painel_snapshot (gscpi)"
          git push
