name: 51 - Update Painel Snapshot Soja (Preço Soja)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["50 - Update Preço Soja (series/preco_soja.json)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: soja-main-push
  cancel-in-progress: false

jobs:
  update-snapshot-preco-soja:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas
      - run: |
          python scripts/soja/update_painel_snapshot_preco_soja.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git add data/soja/painel_snapshot.json
          git commit -m "data(soja): update painel_snapshot (preco_soja)"
          git pull --rebase origin main

          git push
