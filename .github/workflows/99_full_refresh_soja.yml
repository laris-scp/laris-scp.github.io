name: 99_full_refresh_soja

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 1) SERIES (todas as 9 variáveis)
      # Nomes derivados dos workflows 50-69 da soja.
      # =========================
      - name: Run series scripts
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
          FAS_PSD_API_KEY: ${{ secrets.FAS_PSD_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/soja/update_preco_soja_series.py
          python scripts/soja/update_cot_report_series.py
          python scripts/soja/update_usd_brl.py
          python scripts/soja/update_fundamental_stu_series.py
          python scripts/soja/update_crop_condition_series.py
          python scripts/soja/update_crush_spread_series.py
          python scripts/soja/update_oil_crops_outlook_series.py
          python scripts/soja/update_mdic_export_series.py
          python scripts/soja/update_esr_series.py

      # =========================
      # 2) SNAPSHOT (todas as 9 variáveis)
      # =========================
      - name: Run snapshot scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/soja/update_painel_snapshot_preco_soja.py
          python scripts/soja/update_painel_snapshot_cot_report.py
          python scripts/soja/update_painel_snapshot_usd_brl.py
          python scripts/soja/update_painel_snapshot_fundamental_stu.py
          python scripts/soja/update_painel_snapshot_crop_condition.py
          python scripts/soja/update_painel_snapshot_crush_spread.py
          python scripts/soja/update_painel_snapshot_oil_crops_outlook.py
          python scripts/soja/update_painel_snapshot_mdic_export.py
          python scripts/soja/update_painel_snapshot_esr.py

      # =========================
      # 2.5) AI DIAGNÓSTICO (lê snapshot) — workflow 68
      # =========================
      - name: Update ai_diagnostico.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/soja/update_ai_diagnostico.py

      # =========================
      # 3) TERMÔMETROS (wf66) + HIST (wf67)
      # =========================
      - name: Update thermometros in painel_snapshot.json
        run: |
          python scripts/soja/update_painel_thermometros.py

      - name: Update hist_termometro.json
        run: |
          python scripts/soja/update_hist_termometro.py

      # =========================
      # 4) COMMIT (apenas JSONs do site)
      # =========================
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/*.json
          git add data/soja/painel_snapshot.json
          git add data/soja/hist_termometro.json
          git add data/soja/ai_diagnostico.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data(soja): full refresh (series + snapshot + thermometros + ai)"
          git pull --rebase origin main
          git push
