name: 12 - Update CLIMA (SOIL MOISTURE) (series/clima_soil.json)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 5 * *"   # Dia 5, 10:00 UTC (07:00 BRT)
    - cron: "0 13 10 * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-clima-soil-series:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade cdsapi
          pip install pandas numpy xarray netcdf4

      - name: Run clima soil series updater
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          python scripts/cafe/update_clima_soil_series.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/series/clima_soil.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(cafe): update clima_soil.json"
          git pull --rebase origin main

          git push
