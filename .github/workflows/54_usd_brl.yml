name: 54 - Update USD/BRL Soja (series/usd_brl.json)

on:
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 07:00 America/Sao_Paulo (UTC-3)
    - cron: "38 10 * * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-usdbrl-soja:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run updater
        run: |
          python scripts/soja/update_usd_brl.py

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/usd_brl.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "data(soja): update usd_brl.json"
          git pull --rebase origin main
          git push
