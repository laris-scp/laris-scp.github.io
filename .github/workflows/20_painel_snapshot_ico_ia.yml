name: 20 - Painel Snapshot - ICO (IA)

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "19 - Update ICO (IA) (series/ico_ia.json)"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  painel-snapshot-ico-ia:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run painel snapshot updater (ICO IA)
        run: |
          python scripts/cafe/update_painel_snapshot_ico_ia.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/painel_snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(cafe): update painel_snapshot (ico_ia)"
          git push
