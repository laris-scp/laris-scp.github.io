name: 06 - Update Painel Snapshot (COT Report)

on:
  workflow_dispatch:

  workflow_run:
    workflows: ["05 - Update COT Report (series/cot_report.json)"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas
      - run: |
          python scripts/cafe/update_painel_snapshot_cot_report.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git add data/cafe/painel_snapshot.json
          git commit -m "data(cafe): update painel_snapshot (COT Report)"
          git push
