name: "18 - Update painel_snapshot (Estoques Certificados)"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["17 - cafe - estoques_certificados - series"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false  

jobs:
  update_snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run snapshot updater
        run: |
          python scripts/cafe/update_painel_snapshot_estoques_certificados.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cafe/painel_snapshot.json
          git diff --cached --quiet || git commit -m "data(cafe): update painel_snapshot (estoques_certificados)"
          git push
