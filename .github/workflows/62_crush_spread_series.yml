name: 62 - Update Crush Spread Soja (series/crush_spread.json)

on:
  workflow_dispatch:
  schedule:
    # Roda toda terça a sexta às 22:00 UTC (após fechamento do mercado americano)
    # CBOT fecha às 14:20 CT (~19:20 UTC); 22h dá folga para Yahoo atualizar
    - cron: "09 22 * * 2,3,4,5"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.66" pandas

      - name: Run series script
        run: |
          python scripts/soja/update_crush_spread_series.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/crush_spread.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data(soja): update crush_spread.json"

          # Push resiliente a falhas transitórias (HTTP 502 etc.)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falhou (tentativa $i). Aguardando antes de tentar de novo..."
            sleep 15
          done

          echo "Push falhou após 5 tentativas."
          exit 1
