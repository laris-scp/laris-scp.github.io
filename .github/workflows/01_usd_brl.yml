name: 01 - Update USD/BRL (series/usd_brl.json)

on:
  workflow_dispatch:
  schedule:
    # 10:00 UTC = 07:00 America/Sao_Paulo (UTC-3)
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-usdbrl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run updater
        run: |
          python scripts/cafe/update_usd_brl.py

      - name: Commit only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/series/usd_brl.json
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "data(cafe): update usd_brl.json"

          # Push resiliente a falhas transitórias (HTTP 502) e race conditions
          # (cannot lock ref). O pull --rebase dentro do loop rebaseia na nova
          # posição do main a cada tentativa.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falhou (tentativa $i). Aguardando antes de tentar de novo..."
            sleep 15
          done

          echo "Push falhou após 5 tentativas."
          exit 1
