name: 60 - Update MDIC Export Soja (series/mdic_export.json)

on:
  workflow_dispatch:
  schedule:
    # Roda nos dias 5, 10 e 15 do mês às 14:00 UTC
    # MDIC publica dados consolidados nos primeiros dias úteis do mês seguinte
    - cron: "0 14 5 * *"
    - cron: "0 14 10 * *"
    - cron: "0 14 15 * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run series script
        run: |
          python scripts/soja/update_mdic_export_series.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/mdic_export.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data(soja): update mdic_export.json"
          git pull --rebase origin main
          git push
