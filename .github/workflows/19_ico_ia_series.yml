name: 19 - Update ICO (IA) (series/ico_ia.json)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 5 * *"   # Dia 5, 10:00 UTC (07:00 BRT)

permissions:
  contents: write

concurrency:
  group: cafe-ico-ia-series
  cancel-in-progress: false

jobs:
  update-ico-ia-series:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade openai pdfplumber requests

      - name: Run ICO IA series updater
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/cafe/update_ico_ia_series.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/series/ico_ia.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(cafe): update ico_ia.json"
          git push
