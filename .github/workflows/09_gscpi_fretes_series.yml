name: 09 - Update GSCPI (Fretes) (series/gscpi_fretes.json)

on:
  workflow_dispatch:
  schedule:
  # Dia 5 às 07:00 BRT = 10:00 UTC
  - cron: "0 10 5 * *"

permissions:
  contents: write

concurrency:
  group: cafe-gscpi-series
  cancel-in-progress: false

jobs:
  update-gscpi-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd

      - run: |
          python scripts/cafe/update_gscpi_fretes_series.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git add data/cafe/series/gscpi_fretes.json
          git commit -m "data(cafe): update gscpi_fretes.json"
          git push
