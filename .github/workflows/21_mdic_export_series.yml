name: 21 - MDIC Export (Series)

on:
  workflow_dispatch:
  schedule:
    # roda mensalmente no dia 5 às 22:30 UTC (mesmo padrão mensal)
    - cron: "30 22 5 * *"

jobs:
  mdic_export_series:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run MDIC export series update
        run: |
          python scripts/cafe/update_mdic_export_series.py

      - name: Commit updated series
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/cafe/series/mdic_export.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update MDIC export series"
            git push
          fi
