name: 64 - Update Oil Crops Outlook (series/oil_crops_outlook.json)

on:
  workflow_dispatch:
    inputs:
      backfill_n:
        description: "Quantos relatórios mais recentes processar (1 = só o último)"
        required: true
        default: "3"
  schedule:
    - cron: "08 16 15 * *"
    - cron: "08 16 17 * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-oil-crops-outlook-series:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade anthropic pdfplumber requests

      - name: Update CA certificates
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          python -m pip install --upgrade certifi

      - name: Run Oil Crops Outlook series updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCS_BACKFILL_N: ${{ github.event.inputs.backfill_n || '3' }}
        run: |
          python scripts/soja/update_oil_crops_outlook_series.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/oil_crops_outlook.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(soja): update oil_crops_outlook.json"
          git pull --rebase origin main

          git push
