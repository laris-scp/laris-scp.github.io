name: 14_fundamental_stu_series

on:
  workflow_dispatch:
  schedule:
    # Rodar todo dia 5 às 10:00 UTC (ajuste se você quiser)
    - cron: "0 14 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run series script
        env:
          FAS_PSD_API_KEY: ${{ secrets.FAS_PSD_API_KEY }}
        run: |
          python scripts/cafe/update_fundamental_stu_series.py

      - name: Commit and push if changed
        run: |
          git status --porcelain
          git add data/cafe/series/fundamental_stu.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data(cafe): update fundamental_stu.json"
          git push
