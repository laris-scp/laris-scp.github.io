name: 16_hist_termometro

on:
  workflow_dispatch:
  workflow_run:
    # Dispara sempre que QUALQUER snapshot rodar e terminar com sucesso.
    # Ajuste a lista se você quiser restringir.
    workflows:
      - "02 - Update Painel Snapshot (USD/BRL only)"
      - "04 - Update Painel Snapshot (Preço Arábica)"
      - "06 - Update Painel Snapshot (COT Report)"
      - "08 - Update Painel Snapshot (Fertilizante Ureia)"
      - "10 - Update painel_snapshot (GSCPI)"
      - "13 - Update painel_snapshot (CLIMA soil)"
      - "15_painel_snapshot_fundamental_stu"
      - "18 - Update painel_snapshot (Estoques Certificados)"

    types:
      - completed

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run hist_termometro updater
        run: |
          python scripts/cafe/update_hist_termometro.py

      - name: Commit and push if changed
        run: |
          git status --porcelain
          git add data/cafe/hist_termometro.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data(cafe): update hist_termometro.json"
          git push
