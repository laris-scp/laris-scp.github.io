name: 04 - Update Painel Snapshot (Preço Arábica)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["03 - Update Preço Arábica (series/preco_arabica.json)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-snapshot-preco-arabica:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas
      - run: |
          python scripts/cafe/update_painel_snapshot_preco_arabica.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git add data/cafe/painel_snapshot.json
          git commit -m "data(cafe): update painel_snapshot (preco_arabica)"
          git pull --rebase origin main

          git push
