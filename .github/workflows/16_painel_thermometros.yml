name: 16_painel_thermometros

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: painel_thermometros
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run thermometros script
        run: |
          python scripts/cafe/update_painel_thermometros.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cafe/painel_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(cafe): update painel_snapshot.json (thermometros)"
          git push
