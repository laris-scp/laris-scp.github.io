name: 16_painel_thermometros

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "02 - Update Painel Snapshot (USD/BRL only)"
      - "04 - Update Painel Snapshot (Preço Arábica)"
      - "06 - Update Painel Snapshot (COT Report)"
      - "08 - Update Painel Snapshot (Fertilizante Ureia)"
      - "10 - Update painel_snapshot (GSCPI)"
      - "13 - Update painel_snapshot (CLIMA soil)"
      - "15_painel_snapshot_fundamental_stu"
      - "18 - Update painel_snapshot (Estoques Certificados)"
      - "20 - Painel Snapshot - ICO (IA)"
      - "22 - Update Painel Snapshot (MDIC Export)"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run thermometros script
        run: |
          python scripts/cafe/update_painel_thermometros.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cafe/painel_snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(cafe): update painel_snapshot.json (thermometros)"
          git pull --rebase origin main

          git push
