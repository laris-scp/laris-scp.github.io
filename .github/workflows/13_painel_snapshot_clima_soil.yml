name: 13 - Update painel_snapshot (CLIMA soil)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 12 - Update CLIMA (SOIL MOISTURE) (series/clima_soil.json)
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-snapshot-clima:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run snapshot updater (CLIMA soil)
        run: |
          python scripts/cafe/update_painel_snapshot_clima_soil.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cafe/painel_snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(cafe): update painel_snapshot (clima_soil)"
          git push
