name: 69 - Update ESR Export Soja (series/esr.json)

on:
  workflow_dispatch:
  schedule:
    # USDA publica o ESR toda quinta ~08h30 ET.
    # Roda sexta às 13:00 UTC, com folga após a publicação.
    - cron: "0 13 * * 5"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run series script
        env:
          FAS_PSD_API_KEY: ${{ secrets.FAS_PSD_API_KEY }}
        run: |
          python scripts/soja/update_esr_series.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/esr.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data(soja): update esr.json"
          git pull --rebase origin main
          git push
