name: 15_painel_snapshot_fundamental_stu

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["14_fundamental_stu_series"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false  

jobs:
  update:
    # Só roda automaticamente se o workflow da série terminou com sucesso
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run snapshot script
        run: |
          python scripts/cafe/update_painel_snapshot_fundamental_stu.py

      - name: Commit and push if changed
        run: |
          git status --porcelain
          git add data/cafe/painel_snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data(cafe): update painel_snapshot.json (fundamental_stu)"
          git push
