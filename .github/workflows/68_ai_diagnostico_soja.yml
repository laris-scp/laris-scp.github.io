name: 68 - AI Diagnóstico Soja (data/soja/ai_diagnostico.json)

on:
  workflow_dispatch:

  schedule:
    - cron: "33 23 06 * *"
    - cron: "33 23 16 * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  ai-diagnostico:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade anthropic

      - name: Run AI diagnóstico
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/soja/update_ai_diagnostico.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/ai_diagnostico.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data(soja): update ai_diagnostico.json"
          git pull --rebase origin main

          git push
