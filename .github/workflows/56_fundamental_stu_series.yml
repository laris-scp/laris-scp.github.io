name: 56 - Update Fundamental STU Soja (series/fundamental_stu.json)

on:
  workflow_dispatch:
  schedule:
    # Rodar nos dias 5 e 15 às 14:00 UTC (mesma cadência do café)
    - cron: "0 14 5 * *"
    - cron: "0 14 15 * *"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run series script
        env:
          FAS_PSD_API_KEY: ${{ secrets.FAS_PSD_API_KEY }}
        run: |
          python scripts/soja/update_fundamental_stu_series.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/soja/series/fundamental_stu.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data(soja): update fundamental_stu.json"
          git pull --rebase origin main
          git push
