name: 52 - Update COT Report Soja (series/cot_report.json)

on:
  workflow_dispatch:
  schedule:
    # Sexta 23:00 UTC = 20:00 America/Sao_Paulo (UTC-3)
    - cron: "0 23 * * 5"

permissions:
  contents: write

concurrency:
  group: cafe-main-push
  cancel-in-progress: false

jobs:
  update-cot-series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      - run: |
          python scripts/soja/update_cot_report_series.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/soja/series/cot_report.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
          git commit -m "data(soja): update cot_report.json"
          git pull --rebase origin main
          git push
