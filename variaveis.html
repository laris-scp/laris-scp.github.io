<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Variáveis – Café</title>
  <style>
    :root{
      --bg:#0b1020;
      --card:#121a33;
      --text:#e7ecff;
      --muted:#a9b3d6;
      --line:rgba(255,255,255,.10);
      --good:#38bdf8;
      --bad:#fb7185;
      --neutral:#cbd5e1;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text);}
    .container{max-width:1100px;margin:0 auto;padding:24px;}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;}
    h1{margin:0;font-size:22px;font-weight:700;}
    .sub{color:var(--muted);font-size:13px;margin-top:6px;}
    .btnbar{display:flex;gap:10px;flex-wrap:nowrap;}
    a.btn{display:inline-block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-size:13px;background:rgba(255,255,255,.03)}
    a.btn:hover{background:rgba(255,255,255,.06)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
    .cardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
    .title{font-size:14px;font-weight:800;margin:0;}
    .meta{color:var(--muted);font-size:12px;margin-top:4px;}
    .toggle{display:flex;gap:8px;}
    button.tbtn{
      cursor:pointer;border:1px solid var(--line);
      background:rgba(255,255,255,.03); color:var(--text);
      border-radius:10px; padding:8px 10px; font-size:12px;
    }
    button.tbtn.active{background:rgba(255,255,255,.10)}
    .vizbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02)}
    canvas{width:100%;display:block}
    .tablebox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:260px;display:none;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;}
    th{color:var(--muted);font-weight:700;background:rgba(255,255,255,.03)}
    .right{text-align:right}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px;}
    .stat{border:1px solid var(--line);border-radius:12px;padding:8px;background:rgba(255,255,255,.02)}
    .k{color:var(--muted);font-size:10px}
    .v{font-weight:800;margin-top:4px}
    .scorepos{color:var(--good);font-weight:800}
    .scoreneg{color:var(--bad);font-weight:800}
    .scoreneu{color:var(--neutral);font-weight:800}
    .small{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.35}
    details{margin-top:10px}
    details summary{cursor:pointer;color:var(--muted);font-size:12px}
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .stats{grid-template-columns:repeat(2,1fr)}
      header{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Variáveis – Café</h1>
        <div class="sub" id="subtitle">Carregando…</div>
      </div>
      <div class="btnbar">
        <a class="btn" href="index.html">Home</a>
        <a class="btn" href="painel.html">Painel</a>
        <a class="btn" href="variaveis.html">Variáveis</a>
      </div>
    </header>

    <div class="grid" id="grid">
      <div class="card">Carregando…</div>
    </div>
  </div>

  <script>
    const SNAP_URL = "data/cafe/painel_snapshot.json";
    const SERIES_MAP = {
      "preco_arabica": "data/cafe/series/preco_arabica.json",
      "usd_brl": "data/cafe/series/usd_brl.json",
      "gscpi": "data/cafe/series/gscpi_fretes.json",
      "cot_report": "data/cafe/series/cot_report.json",
      "estoques_certificados": "data/cafe/series/estoques_certificados.json",
      "fertilizante_urea": "data/cafe/series/fertilizante_urea.json",
      "fundamental_stu": "data/cafe/series/fundamental_stu.json",
      "clima_soil": "data/cafe/series/clima_soil.json",
      "ico_ia": "data/cafe/series/ico_ia.json"
      "mdic_export": "data/cafe/series/mdic_export.json"
    };

    const DECIMALS_BY_ID = {
      clima_soil: 2,
      cot_report: 0,
      fertilizante_urea: 2,
      gscpi: 2,
      preco_arabica: 2,
      usd_brl: 2,
      estoques_certificados: 0,
      fundamental_stu: 4,
      ico_ia: 0,
    };

    function fmtNumber(n, decimals = 2){
      if(n === null || n === undefined || Number.isNaN(n)) return "—";
      const d = Number(decimals);
      return new Intl.NumberFormat("pt-BR", {
        minimumFractionDigits: d,
        maximumFractionDigits: d
      }).format(n);
    }

    function fmtPercent(p){
      if(p === null || p === undefined || Number.isNaN(p)) return "—";
      return new Intl.NumberFormat("pt-BR", { style:"percent", maximumFractionDigits: 2 }).format(p);
    }
    function scoreClass(x){
      if(x === null || x === undefined || Number.isNaN(x)) return "scoreneu";
      if(x > 0.00001) return "scorepos";
      if(x < -0.00001) return "scoreneg";
      return "scoreneu";
    }

    function parseISODate(s){
      const [y,m,d] = String(s).split("-").map(Number);
      return new Date(y, (m||1)-1, d||1);
    }
    function fmtDateBR(iso){
      const dt = parseISODate(iso);
      const dd = String(dt.getDate()).padStart(2,"0");
      const mm = String(dt.getMonth()+1).padStart(2,"0");
      const yy = dt.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    // Base única de gráfico
    function drawMultiLine(canvas, points, opts){
      const o = Object.assign({
        showMM50: true,
        showMM252: true,
        labelClose: "Close",
        labelMM50: "MM50",
        labelMM252: "MM252",
      }, (opts || {}));

      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);

      const padL = 60, padR = 40, padT = 36, padB = 52;
      const iw = W - padL - padR;
      const ih = H - padT - padB;

      if(!points || points.length < 2){
        ctx.fillStyle = "rgba(255,255,255,.70)";
        ctx.font = "14px system-ui";
        ctx.fillText("Série insuficiente para plotar.", padL, padT+20);
        return;
      }

      const keys = ["close"];
      if(o.showMM50) keys.push("mm50");
      if(o.showMM252) keys.push("mm252");

      const values = [];
      for(const p of points){
        for(const k of keys){
          const v = Number(p[k]);
          if(!Number.isNaN(v)) values.push(v);
        }
      }

      if(values.length < 2){
        ctx.fillStyle = "rgba(255,255,255,.70)";
        ctx.font = "14px system-ui";
        ctx.fillText("Série insuficiente para plotar.", padL, padT+20);
        return;
      }

      let yMin = Math.min(...values);
      let yMax = Math.max(...values);
      const margin = (yMax - yMin) * 0.12 || 1;
      yMin -= margin; yMax += margin;

      function xPix(i){ return padL + (i/(points.length-1))*iw; }
      function yPix(v){ return padT + (1 - (v - yMin)/(yMax - yMin))*ih; }

      // grid
      ctx.strokeStyle = "rgba(255,255,255,.08)";
      ctx.lineWidth = 1;
      const gridY = 5;
      for(let k=0;k<=gridY;k++){
        const y = padT + (k/gridY)*ih;
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+iw,y); ctx.stroke();
      }

      // axes
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+ih); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padL,padT+ih); ctx.lineTo(padL+iw,padT+ih); ctx.stroke();

      // y labels
      ctx.fillStyle = "rgba(255,255,255,.70)";
      ctx.font = "18px system-ui";
      for(let k=0;k<=gridY;k++){
        const v = yMax - (k/gridY)*(yMax-yMin);
        const y = padT + (k/gridY)*ih;
        ctx.fillText(v.toFixed(1), 8, y+4);
      }

      const styles = {
        close: "rgba(231,236,255,.92)",
        mm50:  "rgba(56,189,248,.95)",
        mm252: "rgba(251,113,133,.90)"
      };

      function plot(key){
        ctx.strokeStyle = styles[key] || "rgba(231,236,255,.92)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        let started = false;
        points.forEach((p,i)=>{
          const v = Number(p[key]);
          if(Number.isNaN(v)) return;
          const x = xPix(i);
          const y = yPix(v);
          if(!started){ ctx.moveTo(x,y); started = true; }
          else ctx.lineTo(x,y);
        });
        ctx.stroke();
      }

      plot("close");
      if(o.showMM50) plot("mm50");
      if(o.showMM252) plot("mm252");

      // x labels
      ctx.fillStyle = "rgba(255,255,255,.70)";
      ctx.font = "19px system-ui";
      const ticks = 6;
      for(let i=0;i<ticks;i++){
        const idx = Math.round(i*(points.length-1)/(ticks-1));
        const x = xPix(idx);
        const label = fmtDateBR(points[idx].date);
        const tw = ctx.measureText(label).width;
        let xx = x - tw/2;
        if(i === 0) xx = padL;
        if(i === ticks-1) xx = padL + iw - tw;
        ctx.fillText(label, xx, padT + ih + 32);
      }

      // legend
      ctx.font = "18px system-ui";
      let lx = padL + 24;
      ctx.fillStyle = "rgba(255,255,255,.78)";
      ctx.fillText(o.labelClose, lx, padT-2);
      lx += ctx.measureText(o.labelClose).width + 14;

      if(o.showMM50){
        ctx.fillStyle = styles.mm50;
        ctx.fillText(o.labelMM50, lx, padT-2);
        lx += ctx.measureText(o.labelMM50).width + 14;
      }
      if(o.showMM252){
        ctx.fillStyle = styles.mm252;
        ctx.fillText(o.labelMM252, lx, padT-2);
      }
    }

    function getSeriesModeById(varId){
      if(varId === "gscpi") return "CLOSE_ONLY";
      if(varId === "cot_report") return "COT_MM12W";
      if(varId === "estoques_certificados") return "MM12M";
      if(varId === "fertilizante_urea") return "M4_M12";
      if(varId === "fundamental_stu") return "FUNDAMENTAL_STU";
      if(varId === "clima_soil") return "CLIMA_SOIL";
      if(varId === "ico_ia") return "ICO_IA";
      if(varId === "mdic_export") return "MDIC_EXPORT";
      return "DEFAULT";
    }

    function colSpanByMode(mode){
      if(mode === "CLOSE_ONLY") return 2;
      if(mode === "COT_MM12W") return 3;
      if(mode === "MM12M") return 3;
      if(mode === "M4_M12") return 4;
      if(mode === "FUNDAMENTAL_STU") return 5;
      if(mode === "CLIMA_SOIL") return 3;
      if(mode === "ICO_IA") return 3;
      if(mode === "MDIC_EXPORT") return 3;
      return 4;
    }

    function setTableHeaderByMode(card, mode){
      const theadRow = card.querySelector(".tablebox thead tr");
      if(!theadRow) return;

      if(mode === "CLOSE_ONLY"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Close</th>
        `;
        return;
      }

      if(mode === "COT_MM12W"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Close</th>
          <th class="right">MM12W</th>
        `;
        return;
      }

      if(mode === "MM12M"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Total</th>
          <th class="right">MM12M</th>
        `;
        return;
      }

      if(mode === "M4_M12"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Urea</th>
          <th class="right">M4</th>
          <th class="right">M12</th>
        `;
        return;
      }

      if(mode === "FUNDAMENTAL_STU"){
        theadRow.innerHTML = `
          <th>País</th>
          <th class="right">Peso (Prod. 5y)</th>
          <th class="right">Produção (t)</th>
          <th class="right">Δ YoY</th>
          <th class="right">Contrib.</th>
        `;
        return;
      }

      if(mode === "CLIMA_SOIL"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">SWVL3</th>
          <th class="right">Stress_6m</th>
        `;
        return;
      }

      if(mode === "ICO_IA"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Score</th>
          <th>Diagnóstico</th>
        `;
        return;
      }

      if(mode === "MDIC_EXPORT"){
        theadRow.innerHTML = `
          <th>Data</th>
          <th class="right">Sacas</th>
          <th class="right">Kg</th>
        `;
        return;
      }

      theadRow.innerHTML = `
        <th>Data</th>
        <th class="right">Close</th>
        <th class="right">MM50</th>
        <th class="right">MM252</th>
      `;
    }

    function buildCard(snapshotRow){
      const id = snapshotRow.id;
      const dec = DECIMALS_BY_ID[id] ?? 2;
      const mode = getSeriesModeById(id);

      const card = document.createElement("div");
      card.className = "card";
      card.dataset.varid = id;

      card.innerHTML = `
        <div class="cardTop">
          <div>
            <p class="title">${snapshotRow.variavel || id}</p>
            <div class="meta">Frequência: ${snapshotRow.frequencia || "—"} • Última atualização: ${snapshotRow.ultima_atualizacao || "—"}</div>
          </div>
          <div class="toggle">
            <button class="tbtn active" data-mode="chart">Gráfico</button>
            <button class="tbtn" data-mode="table">Tabela</button>
          </div>
        </div>

        <div class="vizbox">
          <canvas data-canvas="1" width="1200" height="480"></canvas>
        </div>

        <div class="tablebox">
          <table>
            <thead>
              <tr>
                <th>Data</th>
                <th class="right">Close</th>
                <th class="right">MM50</th>
                <th class="right">MM252</th>
              </tr>
            </thead>
            <tbody data-tbody="1">
              <tr><td colspan="4" class="muted">Carregando…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="k">Último valor</div>
            <div class="v">${fmtNumber(Number(snapshotRow.ultimo_valor), dec)}</div>
          </div>
          <div class="stat">
            <div class="k">Nível</div>
            <div class="v">${snapshotRow.nivel || "—"}</div>
          </div>
          <div class="stat">
            <div class="k">Tendência</div>
            <div class="v">${snapshotRow.tendencia || "—"}</div>
          </div>
          <div class="stat">
            <div class="k">Momento</div>
            <div class="v">${snapshotRow.momento || "—"}</div>
          </div>
          <div class="stat">
            <div class="k">Score ponderado</div>
            <div class="v ${scoreClass(Number(snapshotRow.score_ponderado))}">${fmtNumber(Number(snapshotRow.score_ponderado), 2)}</div>
          </div>
        </div>

        <details>
          <summary>Ver regra de sinal e fonte</summary>
          <div class="small"><b>Regra:</b> ${(snapshotRow.regra_de_sinal || "—")}</div>
          <div class="small"><b>Fonte:</b> ${(snapshotRow.fonte || "—")}</div>
        </details>
      `;

      // header correto já no build (evita header antigo “fantasma”)
      setTableHeaderByMode(card, mode);

      const btns = Array.from(card.querySelectorAll("button.tbtn"));
      const vizbox = card.querySelector(".vizbox");
      const tablebox = card.querySelector(".tablebox");

      btns.forEach(b=>{
        b.addEventListener("click", ()=>{
          btns.forEach(x=>x.classList.remove("active"));
          b.classList.add("active");
          const m = b.dataset.mode;
          if(m === "table"){
            vizbox.style.display = "none";
            tablebox.style.display = "block";
          } else {
            tablebox.style.display = "none";
            vizbox.style.display = "block";
          }
        });
      });

      const seriesUrl = SERIES_MAP[id];
      if(seriesUrl){
        loadSeriesIntoCard(card, seriesUrl);
      } else {
        const tb = card.querySelector('[data-tbody="1"]');
        const colSpan = colSpanByMode(mode);
        tb.innerHTML = `<tr><td colspan="${colSpan}" class="muted">Série histórica ainda não publicada para esta variável.</td></tr>`;
        const canvas = card.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "rgba(255,255,255,.70)";
        ctx.font = "14px system-ui";
        ctx.fillText("Série histórica ainda não publicada.", 60, 60);
      }

      return card;
    }

    async function loadSeriesIntoCard(card, url){
      const canvas = card.querySelector("canvas");
      const tbody = card.querySelector('[data-tbody="1"]');

      const varId = card.dataset.varid || "";
      const dec = DECIMALS_BY_ID[varId] ?? 2;
      const mode = getSeriesModeById(varId);

      try{
        const res = await fetch(url, { cache:"no-store" });
        if(!res.ok) throw new Error("Falha ao carregar série: " + res.status);
        const data = await res.json();

        // Aceita dois formatos:
        // (A) { series: [...] }  -> padrão
        // (B) { meta: {...}, data: [...] } -> legado
        let raw = [];
        if(Array.isArray(data.series)) raw = data.series.slice();
        else if(Array.isArray(data.data)) raw = data.data.slice();

        // =========================
        // EXCEÇÃO: CLIMA (SOIL) — Stress_6m
        // =========================
        if(varId === "clima_soil"){
          setTableHeaderByMode(card, "CLIMA_SOIL");

          const rows = raw
            .map(p => ({
              date: (p.date || p.Data || p.data),
              swvl3: (p.close ?? p.Close ?? p.value ?? null),
              stress_6m: (p.stress_6m ?? null)
            }))
            .filter(p => !!p.date)
            .sort((a,b)=> String(a.date).localeCompare(String(b.date)));

          // tabela: últimos 24 (mais recente em cima)
          const tail = rows.slice(-24).reverse();
          tbody.innerHTML = "";

          if(tail.length === 0){
            tbody.innerHTML = `<tr><td colspan="3" class="muted">Série vazia.</td></tr>`;
          } else {
            for(const r of tail){
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${fmtDateBR(r.date)}</td>
                <td class="right">${fmtNumber(Number(r.swvl3), dec)}</td>
                <td class="right">${(r.stress_6m === null || r.stress_6m === undefined) ? "—" : fmtNumber(Number(r.stress_6m), dec)}</td>
              `;
              tbody.appendChild(tr);
            }
          }

          // gráfico: Stress_6m contínuo (linha única)
          const ptsChart = rows
            .map(r => ({ date: r.date, close: Number(r.stress_6m), mm50: NaN, mm252: NaN }))
            .filter(p => !Number.isNaN(p.close));

          drawMultiLine(canvas, ptsChart, {
            showMM50:false,
            showMM252:false,
            labelClose:"Stress_6m"
          });

          return;
        }
        // =========================
        // ICO (IA) — Qualitativa (Score + Label)
        // =========================
        if(mode === "ICO_IA"){
          setTableHeaderByMode(card, mode);

          const rows = raw
            .map(p => ({
              date: (p.date || p.Data || p.data),
              score: (p.close ?? p.signal ?? null),
              label: (p.label ?? "")
            }))
            .filter(p => !!p.date)
            .sort((a,b)=> String(a.date).localeCompare(String(b.date)));

          // tabela: últimos 24 (mais recente em cima)
          const tail = rows.slice(-24).reverse();
          tbody.innerHTML = "";

          if(tail.length === 0){
            tbody.innerHTML = `<tr><td colspan="3" class="muted">Série vazia.</td></tr>`;
          } else {
            for(const r of tail){
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${fmtDateBR(r.date)}</td>
                <td class="right">${fmtNumber(Number(r.score), dec)}</td>
                <td>${String(r.label || "—")}</td>
              `;
              tbody.appendChild(tr);
            }
          }

          // gráfico: linha do score (sem MMs)
          const ptsChart = rows
            .map(r => ({ date: r.date, close: Number(r.score), mm50: NaN, mm252: NaN }))
            .filter(p => !Number.isNaN(p.close));

          drawMultiLine(canvas, ptsChart, {
            showMM50:false,
            showMM252:false,
            labelClose:"Score"
          });

          return;
        }


        // =========================
        // FUNDAMENTAL_STU (decomp)
        // =========================
        if(mode === "FUNDAMENTAL_STU"){
          setTableHeaderByMode(card, mode);
          tbody.innerHTML = "";

          const rows = (data && data.decomp && Array.isArray(data.decomp.rows)) ? data.decomp.rows : [];
          if(rows.length === 0){
            tbody.innerHTML = `<tr><td colspan="5" class="muted">Decomposição vazia.</td></tr>`;
          } else {
            for(const r of rows){
              const tr = document.createElement("tr");
              tr.innerHTML = `
                <td>${String(r.country ?? "—")}</td>
                <td class="right">${fmtPercent(Number(r.w_prod_5y))}</td>
                <td class="right">${fmtNumber(Number(r.prod))}</td>
                <td class="right">${fmtNumber(Number(r.d_prod_yoy))}</td>
                <td class="right">${fmtNumber(Number(r.contrib))}</td>
              `;
              tbody.appendChild(tr);
            }
          }

          // gráfico: linha única (STU World) — usar close
          const ptsChart = raw
            .map(p => ({
              date: (p.date || p.Data || p.data),
              close: Number(p.close ?? p.Close ?? p.value),
              mm50: NaN,
              mm252: NaN
            }))
            .filter(p => !!p.date && !Number.isNaN(p.close))
            .sort((a,b)=> String(a.date).localeCompare(String(b.date)));

          drawMultiLine(canvas, ptsChart, { showMM50:false, showMM252:false, labelClose:"STU (World)" });
          return;
        }

        // =========================
        // MODOS PADRÃO (com mm50/mm252)
        // =========================
        const pts = raw.map(p => {
          const date = (p.date || p.Data || p.data);
          const close = (p.close ?? p.Close ?? p.basis_med5 ?? p.basis ?? p.value);

          let mm50  = (p.mm12w ?? p.mm12W ?? p.mm4m ?? p.mm50 ?? p.MM50);
          let mm252 = (p.mm252 ?? p.MM252);

          if(mode === "MM12M"){
            mm50 = (p.mm12m ?? mm50);
            mm252 = NaN;
          } else if(mode === "M4_M12"){
            mm252 = (p.mm12m ?? mm252);
          } else {
            if(mm252 == null) mm252 = (p.mm12m ?? mm252);
          }

          return { date, close, mm50, mm252 };
        }).filter(p => !!p.date);

        pts.sort((a,b)=> String(a.date).localeCompare(String(b.date)));

        setTableHeaderByMode(card, mode);

        tbody.innerHTML = "";
        if(pts.length === 0){
          const colSpan = colSpanByMode(mode);
          tbody.innerHTML = `<tr><td colspan="${colSpan}" class="muted">Série vazia.</td></tr>`;
        } else {
          for(let i=pts.length-1; i>=0; i--){
            const p = pts[i];
            const tr = document.createElement("tr");

            if(mode === "CLOSE_ONLY"){
              tr.innerHTML = `
                <td>${fmtDateBR(p.date)}</td>
                <td class="right">${fmtNumber(Number(p.close), dec)}</td>
              `;
            } else if(mode === "COT_MM12W"){
              tr.innerHTML = `
                <td>${fmtDateBR(p.date)}</td>
                <td class="right">${fmtNumber(Number(p.close), dec)}</td>
                <td class="right">${fmtNumber(Number(p.mm50), 2)}</td>
              `;
            } else if(mode === "MM12M"){
              tr.innerHTML = `
                <td>${fmtDateBR(p.date)}</td>
                <td class="right">${fmtNumber(Number(p.close), dec)}</td>
                <td class="right">${fmtNumber(Number(p.mm50), 2)}</td>
              `;
            } else if(mode === "M4_M12"){
              tr.innerHTML = `
                <td>${fmtDateBR(p.date)}</td>
                <td class="right">${fmtNumber(Number(p.close), dec)}</td>
                <td class="right">${fmtNumber(Number(p.mm50), 2)}</td>
                <td class="right">${fmtNumber(Number(p.mm252), 2)}</td>
              `;
            } else {
              tr.innerHTML = `
                <td>${fmtDateBR(p.date)}</td>
                <td class="right">${fmtNumber(Number(p.close), dec)}</td>
                <td class="right">${fmtNumber(Number(p.mm50), 2)}</td>
                <td class="right">${fmtNumber(Number(p.mm252), 2)}</td>
              `;
            }

            tbody.appendChild(tr);
          }
        }

        // Gráfico
        if(mode === "CLOSE_ONLY"){
          const ptsChart = pts.map(p => ({ date: p.date, close: Number(p.close), mm50: NaN, mm252: NaN })).filter(p=>!Number.isNaN(p.close));
          drawMultiLine(canvas, ptsChart, { showMM50:false, showMM252:false });

        } else if(mode === "COT_MM12W"){
          const ptsChart = pts.map(p => ({ date: p.date, close: Number(p.close), mm50: Number(p.mm50), mm252: NaN }))
            .filter(p=>!Number.isNaN(p.close));
          drawMultiLine(canvas, ptsChart, { showMM50:true, showMM252:false, labelMM50:"MM12W" });

        } else if(mode === "MM12M"){
          const ptsChart = pts.map(p => ({ date: p.date, close: Number(p.close), mm50: Number(p.mm50), mm252: NaN }))
            .filter(p=>!Number.isNaN(p.close));
          drawMultiLine(canvas, ptsChart, { showMM50:true, showMM252:false, labelMM50:"MM12M" });

        } else if(mode === "M4_M12"){
          // mm50 = M4 | mm252 = M12
          const ptsChart = pts.map(p => ({ date: p.date, close: Number(p.close), mm50: Number(p.mm50), mm252: Number(p.mm252) }))
            .filter(p=>!Number.isNaN(p.close));
          drawMultiLine(canvas, ptsChart, { showMM50:true, showMM252:true, labelClose:"Urea", labelMM50:"M4", labelMM252:"M12" });

        } else {
          const ptsChart = pts.map(p => ({ date: p.date, close: Number(p.close), mm50: Number(p.mm50), mm252: Number(p.mm252) }))
            .filter(p=>!Number.isNaN(p.close));
          drawMultiLine(canvas, ptsChart, { showMM50:true, showMM252:true, labelMM50:"MM50", labelMM252:"MM252" });
        }

      }catch(err){
        const colSpan = colSpanByMode(getSeriesModeById(card.dataset.varid || ""));
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="muted">Erro: ${String(err.message || err)}</td></tr>`;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "rgba(255,255,255,.70)";
        ctx.font = "14px system-ui";
        ctx.fillText("Erro ao carregar série.", 60, 60);
        console.error(err);
      }
    }

    async function main(){
      const subtitle = document.getElementById("subtitle");
      const grid = document.getElementById("grid");

      try{
        const res = await fetch(SNAP_URL, { cache:"no-store" });
        if(!res.ok) throw new Error("Falha ao carregar snapshot: " + res.status);
        const snap = await res.json();

        subtitle.textContent =
          `Abaixo estão séries históricas das variáveis que impactam o preço do café. ` +
          `Nos cards, clique em "Gráfico" para ver a evolução dos dados ou em "Tabela" para uma visão tabular. ` +
          `Atualizado em: ${snap.updated_at || "—"}.`;

        const rows = Array.isArray(snap.rows) ? snap.rows.slice() : [];

        grid.innerHTML = "";
        rows.forEach(r=>{
          grid.appendChild(buildCard(r));
        });

        if(rows.length === 0){
          grid.innerHTML = `<div class="card">Snapshot sem variáveis.</div>`;
        }

      }catch(err){
        subtitle.textContent = "Erro ao carregar dados.";
        grid.innerHTML = `<div class="card">Erro: ${String(err.message || err)}</div>`;
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
